<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dugout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: editor rail on the left, live phone/desktop preview on the right. */
:root {
  --bg: #EEEFF1; --panel: #FFFFFF; --ink: #111418; --muted: #5E6571; --line: #D9DCE1;
  --soft: #F5F6F7; --accent: #B3122E; --ok: #1E7A45; --warn: #9A6200;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0E1013; --panel: #16191E; --ink: #ECEEF1; --muted: #9AA1AD; --line: #2A2E35; --soft: #1D2026; --accent: #E0485E; --ok: #4CC184; --warn: #E0A23B; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0E1013; --panel: #16191E; --ink: #ECEEF1; --muted: #9AA1AD; --line: #2A2E35; --soft: #1D2026; --accent: #E0485E; --ok: #4CC184; --warn: #E0A23B; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; height: 100%; }
.rail { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
.head { padding: 14px max(16px, env(safe-area-inset-left, 0px)) 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.head h1 { font: 700 15px var(--body); margin: 0; letter-spacing: 0.02em; }
.head .state { margin-left: auto; font: 600 11px var(--mono); letter-spacing: 0.06em; padding: 4px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.head .state.dirty { color: var(--warn); }
.head .state.live { color: var(--ok); }
.tabs { display: flex; gap: 2px; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 10px 10px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
.pane { flex: 1; overflow: auto; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 120px; }
.help { color: var(--muted); font-size: 13px; margin: 0 0 14px; }

.sec { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 10px; }
.sec.hidden-sec { opacity: 0.55; }
.sec-h { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px; }
.sec-h .ty { font: 600 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--soft); padding: 3px 6px; border-radius: 4px; }
.sec-h .nm { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; text-align: left; padding: 4px 0; }
.icon { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; width: 30px; height: 30px; display: inline-grid; place-items: center; font: 13px var(--mono); padding: 0; color: var(--muted); }
.icon:hover { color: var(--ink); border-color: var(--ink); }
.icon.danger:hover { color: var(--accent); border-color: var(--accent); }
.sec-b { padding: 4px 12px 14px; border-top: 1px solid var(--line); }
.field { display: grid; gap: 4px; margin-top: 10px; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.field input[type=text], .field input[type=url], .field input[type=email], .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--soft); border-radius: 6px; padding: 8px 10px;
}
.field textarea { min-height: 72px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
.imgrow { display: flex; gap: 6px; }
.imgrow input { flex: 1; min-width: 0; }
.items { margin-top: 14px; display: grid; gap: 8px; }
.item { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px 10px; background: var(--soft); }
.item.is-ph { border-color: var(--accent); }
.item-h { display: flex; align-items: center; gap: 6px; }
.item-h b { flex: 1; font: 600 11px var(--mono); color: var(--muted); }
.item .field input, .item .field textarea, .item .field select { background: var(--panel); }
.phbadge { font: 600 9px var(--mono); letter-spacing: 0.08em; color: #fff; background: var(--accent); padding: 2px 5px; border-radius: 3px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.red { color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add { margin-top: 14px; display: flex; gap: 8px; }
.add select { flex: 1; border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 8px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 4px; font-size: 14px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--panel); outline: 1px solid var(--line); }
.msg { font: 12px var(--mono); margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--accent); }

.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage-bar { display: flex; gap: 8px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 10px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.stage-bar .sp { flex: 1; }
.frame-wrap { flex: 1; display: grid; place-items: start center; overflow: auto; padding: 20px; }
.frame-wrap iframe { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); width: 100%; height: 100%; min-height: 600px; }
.frame-wrap.phone iframe { width: 390px; max-width: 100%; height: 780px; border-radius: 28px; border-width: 8px; border-color: var(--ink); }
.mobile-toggle { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .stage { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); }
  .app.show-preview .stage { display: flex; }
  .mobile-toggle { display: block; position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 11; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .frame-wrap { padding: 0; }
  .frame-wrap iframe, .frame-wrap.phone iframe { width: 100%; height: 100%; border: 0; border-radius: 0; min-height: 0; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <div class="head">
      <h1>Dugout · 사이트 관리</h1>
      <button class="icon" id="undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">↶</button>
      <span class="state" id="state">불러오는 중</span>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="me" aria-selected="true">개인 페이지</button>
      <button role="tab" data-tab="work" aria-selected="false">브랜드 페이지</button>
      <button role="tab" data-tab="gate" aria-selected="false">첫 화면 팝업</button>
      <button role="tab" data-tab="look" aria-selected="false">디자인</button>
      <button role="tab" data-tab="publish" aria-selected="false">게시</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
  <section class="stage">
    <div class="stage-bar">
      <div class="seg" id="route">
        <button data-hash="" aria-pressed="false">팝업</button>
        <button data-hash="me" aria-pressed="true">개인</button>
        <button data-hash="work" aria-pressed="false">브랜드</button>
      </div>
      <div class="seg" id="device">
        <button data-dev="phone" aria-pressed="true">폰</button>
        <button data-dev="desktop" aria-pressed="false">PC</button>
      </div>
      <span class="sp"></span>
      <button class="btn primary" id="publishTop">게시하기</button>
    </div>
    <div class="frame-wrap phone" id="frameWrap"><iframe id="frame" src="../preview.html#me" title="미리보기"></iframe></div>
  </section>
  <button class="btn primary mobile-toggle" id="mToggle">미리보기</button>
</div>

<script>
(function () {
  "use strict";
  var DRAFT_KEY = "cp-draft", GH_KEY = "cp-github";
  var TYPES = {
    hero:     { name: "대표 소개", fields: [["eyebrow", "작은 윗글"], ["headline", "큰 제목"], ["sub", "설명", "area"]] },
    now:      { name: "지금 하는 것", fields: [["title", "섹션 제목"]], item: [["label", "분류"], ["text", "내용", "area"], ["url", "링크"], ["badge", "오른쪽 표시"]], blank: { label: "", text: "", url: "", badge: "" } },
    links:    { name: "소셜 링크", fields: [["title", "섹션 제목"], ["style", "모양", "select", [["list", "줄 목록"], ["grid", "타일"]]]], item: [["label", "플랫폼"], ["handle", "계정/표시 이름"], ["url", "링크"], ["note", "짧은 메모"]], blank: { label: "", handle: "", url: "", note: "" } },
    list:     { name: "버킷리스트", fields: [["title", "섹션 제목"], ["intro", "소개 문장", "area"]], item: [["text", "항목"], ["done", "완료", "check"], ["note", "메모"]], blank: { text: "", done: false, note: "" } },
    promos:   { name: "프로모션 코드", fields: [["title", "섹션 제목"]], item: [["brand", "브랜드"], ["code", "코드"], ["text", "설명", "area"], ["url", "링크"]], blank: { brand: "", code: "", text: "", url: "" } },
    gallery:  { name: "영상/포트폴리오 카드", fields: [["title", "섹션 제목"], ["columns", "한 줄에 몇 개", "select", [["1", "1"], ["2", "2"], ["3", "3"], ["4", "4"]]]], item: [["title", "제목"], ["subtitle", "부제"], ["url", "링크"], ["image", "썸네일 이미지", "image"]], blank: { title: "", subtitle: "", url: "", image: "" } },
    stats:    { name: "숫자(스탯 카드)", fields: [["title", "섹션 제목"], ["asOf", "기준 날짜 메모"]], item: [["value", "숫자"], ["label", "설명"]], blank: { value: "", label: "" } },
    services: { name: "제공 서비스", fields: [["title", "섹션 제목"]], item: [["title", "서비스"], ["text", "설명", "area"]], blank: { title: "", text: "" } },
    timeline: { name: "이력(타임라인)", fields: [["title", "섹션 제목"]], item: [["when", "기간"], ["title", "제목"], ["text", "설명", "area"]], blank: { when: "", title: "", text: "" } },
    text:     { name: "자유 글", fields: [["title", "섹션 제목"], ["body", "본문", "area"]] },
    contact:  { name: "연락하기", fields: [["title", "섹션 제목"], ["text", "설명", "area"], ["email", "이메일"], ["cvUrl", "CV/이력서 PDF 링크", "image"], ["cvLabel", "CV 버튼 글자"]] }
  };

  var c = null, liveStr = "", history = [], tab = "me", open = {};
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var pane = $("#pane"), frame = $("#frame");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (x) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[x]; }); }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function uid(p) { return p + "-" + Math.random().toString(36).slice(2, 7); }

  /* ---------- state ---------- */
  var pushT = null;
  function changed(opts) {
    opts = opts || {};
    if (!opts.noHistory) {
      clearTimeout(pushT);
      if (opts.rerender) snapshot(); else pushT = setTimeout(snapshot, 500);
    }
    store(DRAFT_KEY, JSON.stringify(c));
    sendPreview();
    status();
    if (opts.rerender) render();
  }
  function status() {
    var s = $("#state"), dirty = JSON.stringify(c) !== liveStr;
    s.textContent = dirty ? "게시 안 된 변경 있음" : "라이브와 같음";
    s.className = "state " + (dirty ? "dirty" : "live");
  }
  function sendPreview() {
    if (!c) return;
    try { frame.contentWindow.postMessage({ type: "cp-content", content: c }, location.origin); } catch (e) {}
  }
  window.addEventListener("message", function (e) { if (e.origin === location.origin && e.data && e.data.type === "cp-preview-ready") sendPreview(); });
  frame.addEventListener("load", sendPreview);
  function snapshot() {
    clearTimeout(pushT);
    var snap = JSON.stringify(c);
    if (history[history.length - 1] !== snap) { history.push(snap); if (history.length > 80) history.shift(); }
  }
  function undo() {
    snapshot();
    if (history.length < 2) return;
    history.pop();
    c = JSON.parse(history[history.length - 1]);
    changed({ noHistory: true, rerender: true });
  }
  $("#undo").onclick = undo;
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "z" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); undo(); }
  });

  /* ---------- generic field builder ---------- */
  function fieldHTML(path, def, val) {
    var key = def[0], label = def[1], kind = def[2] || "text", id = "f-" + path.join("-");
    if (kind === "check") return '<label class="check"><input type="checkbox" id="' + id + '" data-path="' + path.join(".") + '"' + (val ? " checked" : "") + "> " + esc(label) + "</label>";
    var input;
    if (kind === "area") input = '<textarea id="' + id + '" data-path="' + path.join(".") + '">' + esc(val) + "</textarea>";
    else if (kind === "select") input = '<select id="' + id + '" data-path="' + path.join(".") + '">' + def[3].map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(val) === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>";
    else if (kind === "image") input = '<div class="imgrow"><input type="text" id="' + id + '" data-path="' + path.join(".") + '" value="' + esc(val) + '" placeholder="https://… 또는 업로드"><button class="btn" type="button" data-upload="' + path.join(".") + '">업로드</button></div>';
    else input = '<input type="text" id="' + id + '" data-path="' + path.join(".") + '" value="' + esc(val) + '">';
    return '<label class="field"><span>' + esc(label) + "</span>" + input + "</label>";
  }
  function getAt(path) { return path.reduce(function (o, k) { return o == null ? o : o[k]; }, c); }
  function setAt(path, v) {
    var o = c;
    for (var i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = v;
  }

  pane.addEventListener("input", function (e) {
    var p = e.target.getAttribute("data-path");
    if (!p) return;
    var path = p.split(".");
    var v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    if (path[path.length - 1] === "columns") v = parseInt(v, 10);
    setAt(path, v);
    // editing a placeholder item clears its placeholder flag (except the flag checkbox itself)
    if (path[path.length - 1] !== "placeholder" && e.target.type !== "checkbox") {
      var parent = getAt(path.slice(0, -1));
      if (parent && parent.placeholder) {
        parent.placeholder = false;
        var card = e.target.closest(".item, .sec");
        if (card) { card.classList.remove("is-ph"); var b = card.querySelector(".phbadge"); if (b) b.remove(); var cb = card.querySelector('input[data-path$="placeholder"]'); if (cb) cb.checked = false; }
      }
    }
    if (path[path.length - 1] === "title" || path[path.length - 1] === "headline") {
      var sec = e.target.closest(".sec"); if (sec && path.length === 5) { var nm = sec.querySelector(".nm"); if (nm) nm.textContent = v || "(제목 없음)"; }
    }
    changed();
    if (path[path.length - 1] === "placeholder") render();
  });

  /* ---------- track editor ---------- */
  function renderTrack(key) {
    var t = c.tracks[key];
    var h = '<p class="help">섹션을 눌러 펼치고 글을 바꾸면 오른쪽 미리보기에 바로 보여요. ↑↓로 순서, 눈 아이콘으로 숨기기. 점선 빨간 칸은 아직 채워야 하는 자리(PLACEHOLDER)예요.</p>';
    h += '<label class="field"><span>위쪽 탭 이름</span><input type="text" data-path="tracks.' + key + '.label" value="' + esc(t.label) + '"></label><div style="height:12px"></div>';
    t.sections.forEach(function (s, i) {
      var T = TYPES[s.type] || { name: s.type, fields: [] };
      var isOpen = !!open[s.id];
      var base = ["tracks", key, "sections", i];
      h += '<div class="sec' + (s.visible === false ? " hidden-sec" : "") + (s.placeholder ? " is-ph" : "") + '" data-i="' + i + '">' +
        '<div class="sec-h"><span class="ty">' + esc(T.name) + '</span><button class="nm" data-act="toggle" aria-expanded="' + isOpen + '">' + esc(s.title || s.headline || "(제목 없음)") + "</button>" +
        '<button class="icon" data-act="up" title="위로" aria-label="위로">↑</button><button class="icon" data-act="down" title="아래로" aria-label="아래로">↓</button>' +
        '<button class="icon" data-act="vis" title="' + (s.visible === false ? "보이기" : "숨기기") + '" aria-label="보이기/숨기기">' + (s.visible === false ? "◌" : "●") + "</button>" +
        '<button class="icon danger" data-act="del" title="섹션 삭제" aria-label="섹션 삭제">×</button></div>';
      if (isOpen) {
        h += '<div class="sec-b">' + T.fields.map(function (f) { return fieldHTML(base.concat(f[0]), f, s[f[0]]); }).join("");
        if (s.type === "contact") h += fieldHTML(base.concat("placeholder"), ["placeholder", "아직 임시 내용 (PLACEHOLDER 표시)", "check"], s.placeholder);
        if (T.item) {
          h += '<div class="items">';
          (s.items || []).forEach(function (it, j) {
            var ib = base.concat("items", j);
            h += '<div class="item' + (it.placeholder ? " is-ph" : "") + '" data-j="' + j + '"><div class="item-h"><b>#' + (j + 1) + "</b>" + (it.placeholder ? '<span class="phbadge">PLACEHOLDER</span>' : "") +
              '<button class="icon" data-act="iup" aria-label="항목 위로">↑</button><button class="icon" data-act="idown" aria-label="항목 아래로">↓</button><button class="icon" data-act="idup" title="복제" aria-label="항목 복제">⧉</button><button class="icon danger" data-act="idel" aria-label="항목 삭제">×</button></div>' +
              T.item.map(function (f) { return fieldHTML(ib.concat(f[0]), f, it[f[0]]); }).join("") +
              fieldHTML(ib.concat("placeholder"), ["placeholder", "아직 임시 내용 (PLACEHOLDER 표시)", "check"], it.placeholder) + "</div>";
          });
          h += '</div><div class="add"><button class="btn" data-act="iadd">+ 항목 추가</button></div>';
        }
        h += "</div>";
      }
      h += "</div>";
    });
    h += '<div class="add"><select id="newType" aria-label="새 섹션 종류">' + Object.keys(TYPES).map(function (k) { return '<option value="' + k + '">' + esc(TYPES[k].name) + "</option>"; }).join("") + '</select><button class="btn primary" data-act="sadd">+ 섹션 추가</button></div>';
    pane.innerHTML = h;
  }

  pane.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act],[data-upload],[data-accent]");
    if (!b) return;
    if (b.hasAttribute("data-upload")) return pickUpload(b.getAttribute("data-upload").split("."));
    if (b.hasAttribute("data-accent")) { c.settings.accent = b.getAttribute("data-accent"); return changed({ rerender: true }); }
    var act = b.getAttribute("data-act");
    if (tab !== "me" && tab !== "work") return otherAction(act, b);
    var secs = c.tracks[tab].sections;
    var secEl = b.closest(".sec"), i = secEl ? +secEl.getAttribute("data-i") : -1;
    var itEl = b.closest(".item"), j = itEl ? +itEl.getAttribute("data-j") : -1;
    var s = secs[i];
    function mv(arr, a, d) { var t = a + d; if (t < 0 || t >= arr.length) return; var x = arr.splice(a, 1)[0]; arr.splice(t, 0, x); }
    switch (act) {
      case "toggle": open[s.id] = !open[s.id]; render(); return;
      case "up": mv(secs, i, -1); break;
      case "down": mv(secs, i, 1); break;
      case "vis": s.visible = s.visible === false; break;
      case "del":
        if (b.dataset.armed) { secs.splice(i, 1); }
        else { b.dataset.armed = "1"; b.textContent = "삭제?"; b.style.width = "auto"; b.style.padding = "0 8px"; setTimeout(function () { if (b.isConnected) { delete b.dataset.armed; b.textContent = "×"; b.style.width = ""; b.style.padding = ""; } }, 2500); return; }
        break;
      case "iup": mv(s.items, j, -1); break;
      case "idown": mv(s.items, j, 1); break;
      case "idup": s.items.splice(j + 1, 0, JSON.parse(JSON.stringify(s.items[j]))); break;
      case "idel": s.items.splice(j, 1); break;
      case "iadd": s.items = s.items || []; s.items.push(JSON.parse(JSON.stringify(TYPES[s.type].blank))); break;
      case "sadd":
        var ty = $("#newType").value, T = TYPES[ty], ns = { id: uid(tab), type: ty, visible: true };
        T.fields.forEach(function (f) { ns[f[0]] = f[2] === "select" ? (f[0] === "columns" ? 3 : f[3][0][0]) : ""; });
        ns.title = T.name === "대표 소개" ? "" : "New section";
        if (ty === "hero") ns.headline = "Headline";
        if (T.item) ns.items = [JSON.parse(JSON.stringify(T.blank))];
        secs.push(ns); open[ns.id] = true; break;
      default: return;
    }
    changed({ rerender: true });
  });

  /* ---------- gate / look / publish tabs ---------- */
  function renderGate() {
    var G = [["eyebrow", "작은 윗글"], ["title", "큰 문장"], ["question", "질문"], ["personalLabel", "개인 버튼 제목"], ["personalSub", "개인 버튼 설명", "area"], ["workLabel", "브랜드 버튼 제목"], ["workSub", "브랜드 버튼 설명", "area"]];
    pane.innerHTML = '<p class="help">링크를 처음 누른 사람이 보는 선택 화면이에요. 인스타 바이오에는 기본 주소를, 브랜드에게는 주소 뒤에 #work를 붙여 보내면 팝업 없이 바로 브랜드 페이지가 열려요.</p>' +
      G.map(function (f) { return fieldHTML(["gate", f[0]], f, c.gate[f[0]]); }).join("");
    setRoute("");
  }
  function renderLook() {
    var s = c.settings, p = c.profile;
    var sw = ["#B3122E", "#0F1216", "#1F4FD8", "#1E7A45", "#C2410C", "#6D28D9"];
    pane.innerHTML =
      '<div class="card"><h3>프로필</h3>' +
      fieldHTML(["profile", "name"], ["name", "이름"], p.name) +
      fieldHTML(["profile", "location"], ["location", "지역"], p.location) +
      fieldHTML(["profile", "catchphrase"], ["catchphrase", "캐치프레이즈"], p.catchphrase) +
      fieldHTML(["profile", "avatar"], ["avatar", "프로필 사진 (비워두면 안 보임)", "image"], p.avatar) + "</div>" +
      '<div class="card"><h3>색과 모양</h3>' +
      fieldHTML(["settings", "mode"], ["mode", "밝기", "select", [["auto", "방문자 기기 따라가기"], ["light", "항상 밝게"], ["dark", "항상 어둡게"]]], s.mode) +
      '<label class="field"><span>포인트 색</span><input type="text" data-path="settings.accent" value="' + esc(s.accent) + '"></label><div class="swatches">' +
      sw.map(function (x) { return '<button type="button" data-accent="' + x + '" style="background:' + x + '" aria-label="' + x + '"></button>'; }).join("") + "</div>" +
      fieldHTML(["settings", "displayFont"], ["displayFont", "제목 글꼴", "select", [["Anton", "Anton (썸네일과 같은 글꼴)"], ["Bebas Neue", "Bebas Neue"], ["Oswald", "Oswald"], ["Archivo Black", "Archivo Black"]]], s.displayFont) +
      fieldHTML(["settings", "corners"], ["corners", "모서리", "select", [["sharp", "각지게"], ["soft", "둥글게"]]], s.corners) +
      fieldHTML(["settings", "width"], ["width", "페이지 폭", "select", [["normal", "보통"], ["wide", "넓게"]]], s.width) +
      fieldHTML(["settings", "showPlaceholders"], ["showPlaceholders", "임시(PLACEHOLDER) 항목을 사이트에 보여주기. 공개 전에 끄세요.", "check"], s.showPlaceholders) + "</div>" +
      '<div class="card"><h3>검색/공유 정보</h3>' +
      fieldHTML(["settings", "siteTitle"], ["siteTitle", "브라우저 탭 제목"], s.siteTitle) +
      fieldHTML(["settings", "seoDescription"], ["seoDescription", "검색 설명", "area"], s.seoDescription) + "</div>";
  }
  function renderPublish() {
    var g = ghConf();
    pane.innerHTML =
      '<div class="card"><h3>게시하기</h3><p class="help">게시하면 실제 사이트가 1분 안에 바뀌어요. 그 전까지 바꾼 내용은 이 브라우저에 임시저장돼 있어요.</p>' +
      '<div class="row"><button class="btn primary" data-act="publish">지금 게시</button><button class="btn" data-act="reload">라이브 버전 다시 불러오기</button></div><div class="msg" id="pubMsg"></div></div>' +
      '<div class="card"><h3>GitHub 연결 (한 번만)</h3><p class="help">사이트 파일이 있는 GitHub 저장소와 토큰을 넣어요. 토큰은 이 기기 브라우저에만 저장되고 사이트에는 올라가지 않아요. 토큰이 없으면 아무도 사이트를 바꿀 수 없어요.</p>' +
      '<label class="field"><span>저장소 (예: bruzi/chanho-site)</span><input type="text" id="ghRepo" value="' + esc(g.repo) + '"></label>' +
      '<label class="field"><span>브랜치</span><input type="text" id="ghBranch" value="' + esc(g.branch || "main") + '"></label>' +
      '<label class="field"><span>content.json 위치</span><input type="text" id="ghPath" value="' + esc(g.path || "content.json") + '"></label>' +
      '<label class="field"><span>토큰 (fine-grained, Contents: Read and write)</span><input type="password" id="ghToken" value="' + esc(g.token) + '" autocomplete="off"></label>' +
      '<div class="row" style="margin-top:10px"><button class="btn" data-act="ghsave">저장하고 연결 확인</button><button class="btn red" data-act="ghforget">이 기기에서 토큰 지우기</button></div><div class="msg" id="ghMsg"></div></div>' +
      '<div class="card"><h3>백업</h3><p class="help">전체 내용을 텍스트로 복사해 두거나, 복사해 둔 걸 붙여넣어 되살려요.</p>' +
      '<div class="row"><button class="btn" data-act="copyjson">전체 내용 복사</button><button class="btn" data-act="importjson">붙여넣은 내용으로 바꾸기</button></div>' +
      '<label class="field"><span>붙여넣기 칸</span><textarea id="importBox" placeholder="{ ... }"></textarea></label><div class="msg" id="bkMsg"></div></div>';
  }
  function otherAction(act) {
    if (act === "publish") return publish();
    if (act === "reload") return loadLive(true);
    if (act === "ghsave") {
      store(GH_KEY, JSON.stringify({ repo: $("#ghRepo").value.trim(), branch: $("#ghBranch").value.trim() || "main", path: $("#ghPath").value.trim() || "content.json", token: $("#ghToken").value.trim() }));
      return ghTest();
    }
    if (act === "ghforget") { var g = ghConf(); g.token = ""; store(GH_KEY, JSON.stringify(g)); renderPublish(); return; }
    if (act === "copyjson") {
      var txt = JSON.stringify(c, null, 2);
      var box = $("#importBox");
      try { navigator.clipboard.writeText(txt).then(function () { msg("bkMsg", "복사했어요.", true); }, function () { box.value = txt; box.select(); msg("bkMsg", "아래 칸에 넣어뒀어요. 직접 복사해 주세요.", true); }); }
      catch (e) { box.value = txt; box.select(); }
      return;
    }
    if (act === "importjson") {
      try { var n = JSON.parse($("#importBox").value); if (!n.tracks || !n.gate) throw new Error("사이트 내용 형식이 아니에요"); c = n; changed({ rerender: true }); msg("bkMsg", "불러왔어요. 확인 후 게시하세요.", true); }
      catch (e) { msg("bkMsg", "불러오지 못했어요: " + e.message, false); }
    }
  }
  function msg(id, t, ok) { var m = $("#" + id); if (m) { m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); } }

  /* ---------- GitHub ---------- */
  function ghConf() { try { return JSON.parse(load(GH_KEY) || "{}"); } catch (e) { return {}; } }
  function gh(path, opts) {
    var g = ghConf();
    opts = opts || {};
    return fetch("https://api.github.com" + path, {
      method: opts.method || "GET",
      headers: { "Authorization": "Bearer " + g.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.message || ("HTTP " + r.status)); e.status = r.status; throw e; } return j; }); });
  }
  function ghReady() { var g = ghConf(); return g.repo && g.token && /^[\w.-]+\/[\w.-]+$/.test(g.repo); }
  function ghTest() {
    if (!ghReady()) return msg("ghMsg", "저장소(아이디/이름)와 토큰을 모두 넣어주세요.", false);
    var g = ghConf();
    msg("ghMsg", "확인 중…", true);
    gh("/repos/" + g.repo + "/contents/" + g.path + "?ref=" + encodeURIComponent(g.branch))
      .then(function () { msg("ghMsg", "연결됐어요. 이제 '지금 게시'를 누르면 돼요.", true); })
      .catch(function (e) { msg("ghMsg", e.status === 404 ? "저장소나 content.json을 못 찾았어요. 저장소 이름, 브랜치, 토큰 권한(이 저장소 선택)을 확인하세요." : e.status === 401 ? "토큰이 틀렸거나 만료됐어요." : "연결 실패: " + e.message, false); });
  }
  function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
  function publish() {
    if (!ghReady()) { tab = "publish"; render(); return msg("pubMsg", "먼저 아래 GitHub 연결을 한 번 해주세요.", false); }
    var g = ghConf(), body = JSON.stringify(c, null, 2) + "\n";
    msg("pubMsg", "게시 중…", true);
    var url = "/repos/" + g.repo + "/contents/" + g.path;
    gh(url + "?ref=" + encodeURIComponent(g.branch)).then(function (cur) {
      return gh(url, { method: "PUT", body: { message: "Update site content from Dugout", content: b64(body), sha: cur.sha, branch: g.branch } });
    }).then(function () {
      liveStr = JSON.stringify(c); status();
      msg("pubMsg", "게시했어요. 1분쯤 뒤 실제 사이트에 보여요.", true);
    }).catch(function (e) { msg("pubMsg", "게시 실패: " + e.message, false); });
  }
  $("#publishTop").onclick = function () { tab = "publish"; render(); publish(); if (innerWidth <= 860) $("#app").classList.remove("show-preview"); };

  /* ---------- uploads ---------- */
  function pickUpload(path) {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*,application/pdf";
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var data = rd.result;
        var field = document.getElementById("f-" + path.join("-"));
        if (ghReady()) {
          var g = ghConf(), name = "media/" + Date.now() + "-" + f.name.toLowerCase().replace(/[^a-z0-9.]+/g, "-");
          if (field) field.value = "올리는 중…";
          gh("/repos/" + g.repo + "/contents/" + name, { method: "PUT", body: { message: "Upload " + name, content: data.split(",")[1], branch: g.branch } })
            .then(function () {
              var u = "https://raw.githubusercontent.com/" + g.repo + "/" + g.branch + "/" + name;
              setAt(path, u); if (field) field.value = u; changed();
            })
            .catch(function (e) { if (field) field.value = getAt(path) || ""; alertBox("업로드 실패: " + e.message); });
        } else if (f.size < 350000 && /^image\//.test(f.type)) {
          setAt(path, data); if (field) field.value = data.slice(0, 40) + "…"; changed();
        } else {
          alertBox("큰 파일은 GitHub 연결 후 올릴 수 있어요 (게시 탭). 지금은 350KB 이하 이미지만 바로 넣을 수 있어요.");
        }
      };
      rd.readAsDataURL(f);
    };
    inp.click();
  }
  function alertBox(t) {
    var d = document.createElement("div");
    d.className = "msg err"; d.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--accent);padding:12px;border-radius:8px;z-index:20";
    d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 4500);
  }

  /* ---------- tabs, route, device ---------- */
  function render() {
    document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
    var y = pane.scrollTop;
    if (tab === "me" || tab === "work") { renderTrack(tab); setRoute(tab); }
    else if (tab === "gate") renderGate();
    else if (tab === "look") renderLook();
    else renderPublish();
    pane.scrollTop = y;
  }
  $("#tabs").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; tab = b.dataset.tab; pane.scrollTop = 0; render(); };
  function setRoute(h) {
    document.querySelectorAll("#route button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.hash === h)); });
    try { frame.contentWindow.postMessage({ type: "cp-route", hash: h }, location.origin); } catch (e) {}
  }
  $("#route").onclick = function (e) { var b = e.target.closest("button"); if (b) setRoute(b.dataset.hash); };
  $("#device").onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#device button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    $("#frameWrap").classList.toggle("phone", b.dataset.dev === "phone");
  };
  $("#mToggle").onclick = function () { var a = $("#app"); a.classList.toggle("show-preview"); this.textContent = a.classList.contains("show-preview") ? "편집으로" : "미리보기"; sendPreview(); };

  /* ---------- boot ---------- */
  function loadLive(replaceDraft) {
    return fetch("../content.json?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (live) {
      liveStr = JSON.stringify(live);
      var d = null;
      if (!replaceDraft) { try { d = JSON.parse(load(DRAFT_KEY) || "null"); } catch (e) {} }
      c = d || live;
      history = [JSON.stringify(c)];
      store(DRAFT_KEY, JSON.stringify(c));
      render(); sendPreview(); status();
    }).catch(function () { $("#state").textContent = "불러오기 실패"; });
  }
  loadLive(false);
})();
</script>
</body>
</html>
